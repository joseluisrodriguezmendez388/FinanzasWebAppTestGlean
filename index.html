<style>
:root{
  --artifact-bg: var(--theme-background, #f4f6fb);
  --artifact-surface: var(--theme-background-light, #ffffff);
  --artifact-surface-2: #eef2fa;
  --artifact-text: var(--theme-text-primary, #131a2b);
  --artifact-text-muted: #66718a;
  --artifact-border: #e3e8f2;
  --artifact-primary: var(--theme-primary-highlight, #2f6bff);
  --artifact-primary-soft: rgba(47,107,255,.12);
  --artifact-basicos: #2f6bff;
  --artifact-ahorro: #12b28c;
  --artifact-estilo: #f2a03d;
  --artifact-danger: #e5484d;
  --artifact-danger-soft: rgba(229,72,77,.12);
  --artifact-ok: #12b28c;
  --artifact-ok-soft: rgba(18,178,140,.14);
  --artifact-warn: #e79325;
  --artifact-warn-soft: rgba(231,147,37,.15);
  --artifact-shadow: 0 1px 3px rgba(20,30,60,.08), 0 8px 24px rgba(20,30,60,.05);
  --artifact-sidebar: #0f1b33;
  --artifact-sidebar-text: #c4cdde;
  --artifact-sidebar-active: #2f6bff;
}
html[data-theme='dark']{
  --artifact-bg: #0b1120;
  --artifact-surface: #131c30;
  --artifact-surface-2: #1b2740;
  --artifact-text: #e8edf7;
  --artifact-text-muted: #93a0ba;
  --artifact-border: #24304b;
  --artifact-primary: #5b8bff;
  --artifact-primary-soft: rgba(91,139,255,.18);
  --artifact-shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --artifact-sidebar: #070d1a;
  --artifact-sidebar-text: #aab6cd;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--artifact-bg);color:var(--artifact-text);font-size:14px;line-height:1.45}
a{color:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:240px;background:var(--artifact-sidebar);color:var(--artifact-sidebar-text);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;transition:transform .25s}
.brand{padding:20px 20px 14px;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6bff,#12b28c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px}
.brand h1{font-size:17px;margin:0;color:#fff;font-weight:700;letter-spacing:.2px}
.brand span{font-size:11px;color:#8b97b3}
.nav{padding:6px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--artifact-sidebar-text);font-weight:500;margin-bottom:2px;font-size:13.5px;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--artifact-sidebar-active);color:#fff}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:#5f6b86;padding:14px 14px 6px;font-weight:700}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6b7691}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--artifact-surface);border-bottom:1px solid var(--artifact-border);padding:12px 26px;display:flex;align-items:center;gap:14px}
.topbar .title{font-size:19px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--artifact-text-muted)}
.topbar .spacer{flex:1}
.icon-btn{background:var(--artifact-surface-2);border:1px solid var(--artifact-border);color:var(--artifact-text);width:38px;height:38px;border-radius:9px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:hover{background:var(--artifact-primary-soft);border-color:var(--artifact-primary)}
.menu-toggle{display:none}
.content{padding:24px 26px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{margin-bottom:18px}
.page-head h2{margin:0 0 3px;font-size:22px;font-weight:700}
.page-head p{margin:0;color:var(--artifact-text-muted);font-size:13px}
/* Buttons */
.btn{border:1px solid var(--artifact-border);background:var(--artifact-surface);color:var(--artifact-text);padding:9px 15px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn:hover{border-color:var(--artifact-primary);color:var(--artifact-primary)}
.btn.primary{background:var(--artifact-primary);border-color:var(--artifact-primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{background:var(--artifact-danger);border-color:var(--artifact-danger);color:#fff}
.btn.danger:hover{filter:brightness(1.05);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.big{padding:13px 22px;font-size:15px}
/* Cards */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--artifact-surface);border:1px solid var(--artifact-border);border-radius:14px;padding:18px;box-shadow:var(--artifact-shadow)}
.kpi .label{font-size:12px;color:var(--artifact-text-muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .value{font-size:23px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
.kpi .foot{font-size:11.5px;color:var(--artifact-text-muted);margin-top:5px}
.kpi .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;float:right;background:var(--artifact-primary-soft);color:var(--artifact-primary)}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700}
.card .card-sub{font-size:12px;color:var(--artifact-text-muted);font-weight:400;margin-left:6px}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.chart{width:100%;height:300px}
.chart.tall{height:360px}
/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--artifact-text-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--artifact-border)}
td{padding:11px 12px;border-bottom:1px solid var(--artifact-border)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--artifact-surface-2)}
.table-wrap{overflow-x:auto}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.b{background:var(--artifact-primary-soft);color:var(--artifact-primary)}
.badge.a{background:var(--artifact-ok-soft);color:var(--artifact-ok)}
.badge.e{background:var(--artifact-warn-soft);color:var(--artifact-warn)}
.badge.ok{background:var(--artifact-ok-soft);color:var(--artifact-ok)}
.badge.warn{background:var(--artifact-warn-soft);color:var(--artifact-warn)}
.badge.danger{background:var(--artifact-danger-soft);color:var(--artifact-danger)}
.badge.mut{background:var(--artifact-surface-2);color:var(--artifact-text-muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--artifact-text-muted)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--artifact-border);border-radius:8px;background:var(--artifact-bg);color:var(--artifact-text);font-size:13.5px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--artifact-primary);box-shadow:0 0 0 3px var(--artifact-primary-soft)}
.field .err{color:var(--artifact-danger);font-size:11px;display:none}
.field.invalid input,.field.invalid select{border-color:var(--artifact-danger)}
.field.invalid .err{display:block}
/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(10,16,30,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:34px 16px;overflow-y:auto}
.modal-back.open{display:flex}
.modal{background:var(--artifact-surface);border:1px solid var(--artifact-border);border-radius:16px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s ease}
.modal.wide{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--artifact-border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:20px 22px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:15px 22px;border-top:1px solid var(--artifact-border);display:flex;justify-content:flex-end;gap:10px}
/* Progress */
.progress{height:9px;border-radius:6px;background:var(--artifact-surface-2);overflow:hidden}
.progress > div{height:100%;border-radius:6px;background:var(--artifact-primary);transition:width .5s}
/* Toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--artifact-surface);border:1px solid var(--artifact-border);border-left:4px solid var(--artifact-ok);border-radius:10px;padding:13px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);min-width:280px;max-width:380px;animation:slidein .25s ease;font-size:13px}
.toast.err{border-left-color:var(--artifact-danger)}
.toast.info{border-left-color:var(--artifact-primary)}
.toast b{display:block;margin-bottom:2px}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
/* Misc */
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;gap:11px;padding:12px 14px;border-radius:11px;background:var(--artifact-surface-2);align-items:flex-start}
.rec .rc-ic{font-size:16px;margin-top:1px}
.rec.warn{background:var(--artifact-warn-soft)}
.rec.danger{background:var(--artifact-danger-soft)}
.rec.ok{background:var(--artifact-ok-soft)}
.empty{text-align:center;padding:46px 20px;color:var(--artifact-text-muted)}
.empty .big{font-size:40px;margin-bottom:8px;opacity:.6}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:7px 13px;border-radius:20px;border:1px solid var(--artifact-border);background:var(--artifact-surface);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--artifact-text-muted)}
.pill.active{background:var(--artifact-primary);border-color:var(--artifact-primary);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 11px;border:1px solid var(--artifact-border);border-radius:8px;background:var(--artifact-surface);color:var(--artifact-text);font-size:13px}
.toolbar .spacer{flex:1}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--artifact-text-muted);font-weight:700;margin:22px 0 12px}
.split-form{display:grid;grid-template-columns:1fr;gap:18px}
.mini-stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--artifact-border);font-size:13px}
.mini-stat:last-child{border-bottom:none}
.mini-stat b{font-weight:700}
.loading{display:flex;align-items:center;justify-content:center;padding:50px;color:var(--artifact-text-muted)}
.spinner{width:26px;height:26px;border:3px solid var(--artifact-border);border-top-color:var(--artifact-primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.alert-inline{padding:11px 14px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.alert-inline.warn{background:var(--artifact-warn-soft);color:var(--artifact-warn)}
.alert-inline.danger{background:var(--artifact-danger-soft);color:var(--artifact-danger)}
.alert-inline.ok{background:var(--artifact-ok-soft);color:var(--artifact-ok)}
.info-ic{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--artifact-surface-2);color:var(--artifact-text-muted);font-size:10px;align-items:center;justify-content:center;cursor:help;position:relative;font-style:normal;font-weight:700}
.info-ic:hover .tip{display:block}
.tip{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:var(--artifact-sidebar);color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:400;width:210px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);line-height:1.4}
.subgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.row-actions{display:flex;gap:6px}
.link{color:var(--artifact-primary);cursor:pointer;font-weight:600}
.credit-card-item{border:1px solid var(--artifact-border);border-radius:13px;padding:16px;background:var(--artifact-surface)}
.credit-card-item .cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.credit-card-item .cc-name{font-weight:700;font-size:15px}
.credit-card-item .cc-ent{font-size:12px;color:var(--artifact-text-muted)}
@media (max-width:1000px){.two-col{grid-template-columns:1fr}.subgrid{grid-template-columns:1fr}}
@media (max-width:820px){
  .sidebar{position:fixed;z-index:90;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .menu-toggle{display:flex}
  .form-grid{grid-template-columns:1fr}
  .content{padding:18px 14px 60px}
}
@media print{
  body{margin:0;padding:.4in .5in;background:#fff;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .sidebar,.topbar,.menu-toggle,button,.toolbar,.pill-row,[role="button"]{display:none !important}
  .content{max-width:100% !important;padding:0}
  .card{break-inside:avoid;box-shadow:none !important;border:1px solid rgba(0,0,0,.12)}
  .chart{height:240px !important}
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

<script>
/* ============================ Balance 360 core ============================ */
const STORE_KEY='balance360_v2';
const COP=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
function fmt(n){return '$'+COP.format(Math.round(n||0))+' COP';}
function fmtShort(n){n=Math.round(n||0);return '$'+COP.format(n);}
function pct(n){return (Math.round((n||0)*10)/10)+'%';}
function todayISO(){const d=new Date();return d.toISOString().slice(0,10);}
function nowTime(){return new Date().toTimeString().slice(0,5);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function addDaysISO(iso,days){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
function monthKey(iso){return (iso||todayISO()).slice(0,7);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}

const BUCKETS={basicos:{label:'Costos básicos y obligaciones',color:'var(--artifact-basicos)',short:'Básicos'},
  ahorro:{label:'Ahorro, inversión y liquidez',color:'var(--artifact-ahorro)',short:'Ahorro'},
  estilo:{label:'Estilo de vida y gustos',color:'var(--artifact-estilo)',short:'Estilo de vida'}};

  'Ahorro':'ahorro','Inversión':'ahorro',
  'Compras':'estilo','Lujos':'estilo','Entretenimiento':'estilo','Otros':'estilo'};
const CATEGORIES=['Alimentación','Servicios','Transporte','Vivienda','Salud','Educación','Compras','Lujos','Entretenimiento','Créditos','Ahorro','Inversión','Operación','Emergencias','Seguros','Otros'];

  return {
    settings:{currency:'COP',theme:'light',rules:{basicos:50,ahorro:20,estilo:30},minLiquidity:800000,demo:true},
    accounts:[
      {id:uid(),name:'Cuenta Nómina',type:'Cuenta bancaria',balance:3200000},
      {id:uid(),name:'Efectivo',type:'Efectivo',balance:400000},
      {id:uid(),name:'Ahorro Emergencia',type:'Cuenta de ahorro',balance:2500000},
      {id:uid(),name:'Billetera Nequi',type:'Billetera digital',balance:350000}
    ],
    incomes:[
      {id:uid(),amount:8000000,date:addDaysISO(t,-12),time:'09:00',source:'Salario',category:'Salario',account:'Cuenta Nómina',type:'Fijo',frequency:'Mensual',desc:'Pago de nómina',tags:'principal'},
      {id:uid(),amount:1200000,date:addDaysISO(t,-4),time:'14:30',source:'Freelance',category:'Extra',account:'Billetera Nequi',type:'Variable',frequency:'Eventual',desc:'Proyecto de diseño',tags:'extra'}
    ],

      {id:uid(),amount:620000,date:addDaysISO(t,-10),category:'Alimentación',sub:'Mercado',bucket:'basicos',desc:'Mercado quincenal',method:'Débito',account:'Cuenta Nómina',payee:'Supermercado',recurring:true,budgeted:true},
      {id:uid(),amount:280000,date:addDaysISO(t,-9),category:'Servicios',sub:'Energía/Agua',bucket:'basicos',desc:'Servicios públicos',method:'Débito',account:'Cuenta Nómina',payee:'Empresa Servicios',recurring:true,budgeted:true},
      {id:uid(),amount:900000,date:addDaysISO(t,-8),category:'Ahorro',sub:'Fondo emergencia',bucket:'ahorro',desc:'Aporte ahorro',method:'Transferencia',account:'Ahorro Emergencia',payee:'Propia',recurring:true,budgeted:true},

      {id:uid(),amount:320000,date:addDaysISO(t,-3),category:'Compras',sub:'Ropa',bucket:'estilo',desc:'Compras personales',method:'Crédito',account:'Efectivo',payee:'Tienda',recurring:false,budgeted:false},
      {id:uid(),amount:180000,date:addDaysISO(t,-2),category:'Transporte',sub:'Combustible',bucket:'basicos',desc:'Gasolina',method:'Débito',account:'Cuenta Nómina',payee:'Estación',recurring:false,budgeted:true}
    ],
    credits:[
      {id:uid(),name:'Crédito Vehículo',entity:'Banco Nacional',initial:45000000,balance:28500000,rate:1.2,rateType:'Mensual',cuota:1250000,nCuotas:48,paidCuotas:14,startDate:addDaysISO(t,-420),nextPay:addDaysISO(t,7),insurance:38000,fees:0,status:'Al día',priority:'Media',notes:'Vehículo familiar'},
      {id:uid(),name:'Tarjeta de Crédito',entity:'Banco Visa',initial:6000000,balance:4200000,rate:2.4,rateType:'Mensual',cuota:520000,nCuotas:24,paidCuotas:6,startDate:addDaysISO(t,-190),nextPay:addDaysISO(t,3),insurance:0,fees:15000,status:'Al día',priority:'Alta',notes:'Consumo diferido'},
      {id:uid(),name:'Crédito Libre Inversión',entity:'Cooperativa',initial:10000000,balance:1800000,rate:1.6,rateType:'Mensual',cuota:480000,nCuotas:24,paidCuotas:20,startDate:addDaysISO(t,-600),nextPay:addDaysISO(t,-2),insurance:12000,fees:0,status:'Atrasado',priority:'Alta',notes:'Cuota vencida'}

let DB=load();
function load(){try{const r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r);}catch(e){}const s=seed();localStorage.setItem(STORE_KEY,JSON.stringify(s));return s;}
let FB=null, fbDocRef=null, fbStatus='local', saveTimer=null, localWriteToken=null, fbReady=false;
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){} scheduleCloudSave();}
function setFbStatus(s){fbStatus=s;const el=document.getElementById('fbStatus');if(!el)return;const map={connecting:['warn','\u23f3 Conectando\u2026'],online:['ok','\u2601\ufe0f Firebase'],saving:['warn','\u2601\ufe0f Guardando\u2026'],error:['danger','\u26a0\ufe0f Sin conexi\u00f3n'],local:['mut','\ud83d\udcbe Local']};const p=map[s]||map.local;el.className='badge '+p[0];el.textContent=p[1];}
function mergeDefaults(data){const base=seed();const out=Object.assign({},base,data||{});out.settings=Object.assign({},base.settings,(data&&data.settings)||{});out.settings.rules=Object.assign({},base.settings.rules,((data&&data.settings)||{}).rules||{});['accounts','incomes','expenses','credits','payments','closures','budgets','goals','history'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});return out;}
function scheduleCloudSave(){if(!FB||!fbDocRef)return;clearTimeout(saveTimer);setFbStatus('saving');saveTimer=setTimeout(async()=>{try{const token=uid();localWriteToken=token;const payload=JSON.parse(JSON.stringify(DB));payload._token=token;payload._updatedAt=new Date().toISOString();await FB.setDoc(fbDocRef,payload);setFbStatus('online');}catch(e){setFbStatus('error');toast('Sin sincronizar','No se pudo guardar en Firebase: '+(e.code||e.message),'err');}},700);}
async function initFirebase(){if(fbReady)return;fbReady=true;if(!window.__fb){setFbStatus(window.__fbError?'error':'local');return;}FB=window.__fb;fbDocRef=FB.doc(FB.fdb,'balance360','main');setFbStatus('connecting');
  try{const snap=await FB.getDoc(fbDocRef);
    if(snap.exists()){DB=mergeDefaults(snap.data());save();render();}
    else{const token=uid();localWriteToken=token;const payload=JSON.parse(JSON.stringify(DB));payload._token=token;payload._updatedAt=new Date().toISOString();await FB.setDoc(fbDocRef,payload);}
    setFbStatus('online');
    FB.onSnapshot(fbDocRef,snap2=>{if(!snap2.exists())return;const data=snap2.data();if(data._token&&data._token===localWriteToken)return;if(document.getElementById('modalBack').classList.contains('open'))return;DB=mergeDefaults(data);try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){}render();setFbStatus('online');});
  }catch(e){setFbStatus('error');toast('Firebase','No se pudo conectar: '+(e.code||e.message)+'. Se usan datos locales.','err');}
}
function logHistory(action,detail){DB.history.unshift({id:uid(),ts:new Date().toISOString(),action,detail});if(DB.history.length>400)DB.history.pop();}

/* ------------------------------ computations ------------------------------ */
function totalIncome(){return DB.incomes.reduce((s,i)=>s+i.amount,0);}
function totalExpense(){return DB.expenses.reduce((s,e)=>s+e.amount,0);}
function bucketReal(){const b={basicos:0,ahorro:0,estilo:0};DB.expenses.forEach(e=>{b[e.bucket||'estilo']+=e.amount;});
  // debt principal payments count toward ahorro (pago de deudas)
  return b;}
function recommendedDist(income){const r=DB.settings.rules;return {basicos:income*r.basicos/100,ahorro:income*r.ahorro/100,estilo:income*r.estilo/100};}
function accountsTotal(){return DB.accounts.reduce((s,a)=>s+a.balance,0);}
function totalDebt(){return DB.credits.reduce((s,c)=>s+c.balance,0);}
function totalPaidDebt(){return DB.payments.reduce((s,p)=>s+p.amount,0);}
function upcomingObligations(days){days=days||15;const t=todayISO();const lim=addDaysISO(t,days);
  return DB.credits.filter(c=>c.nextPay<=lim).map(c=>({name:c.name,date:c.nextPay,amount:c.cuota,overdue:c.nextPay<t}));}
function liquidity(){
  const disp=accountsTotal();
  const upcoming=upcomingObligations(15).reduce((s,o)=>s+o.amount,0);
  const net=disp-upcoming;
  let state,cls;
  const min=DB.settings.minLiquidity;
  if(net<0){state='Saldo insuficiente';cls='danger';}
  else if(net<min){state='Riesgo de liquidez';cls='danger';}
  else if(net<min*2){state='Liquidez reducida';cls='warn';}
  else if(net<min*3.5){state='Liquidez moderada';cls='warn';}
  else{state='Liquidez saludable';cls='ok';}
  return {disp,upcoming,net,state,cls,min};
}
function extraPaymentCapacity(){const l=liquidity();return Math.max(0,l.net-l.min);}
function creditProgress(c){return c.initial>0?Math.min(100,(1-c.balance/c.initial)*100):0;}
function creditRemainingCuotas(c){if(c.cuota<=0)return 0;return Math.ceil(c.balance/c.cuota);}
function estFinishDate(c){const rem=creditRemainingCuotas(c);return addDaysISO(c.nextPay,rem*30);}
function estInterest(c){const rem=creditRemainingCuotas(c);const r=c.rate/100;let bal=c.balance,tot=0;for(let i=0;i<rem&&bal>0;i++){const it=bal*r;tot+=it;bal-=(c.cuota-it);}return Math.max(0,tot);}

/* recommendations engine */
function recommendations(){
  const inc=totalIncome();const real=bucketReal();const rec=recommendedDist(inc);const out=[];
  if(inc>0){
    const bp=real.basicos/inc*100, ap=real.ahorro/inc*100, ep=real.estilo/inc*100;
    if(bp>DB.settings.rules.basicos+3) out.push({t:'warn',ic:'⚠️',m:'Tus costos básicos representan el '+pct(bp)+' de tus ingresos. La recomendación inicial es mantenerlos cerca del '+DB.settings.rules.basicos+'%. Revisa gastos recurrentes o servicios que puedan reducirse.'});
    if(ap<DB.settings.rules.ahorro-2) out.push({t:'warn',ic:'💡',m:'Este periodo destinaste el '+pct(ap)+' a ahorro e inversión, por debajo del '+DB.settings.rules.ahorro+'% sugerido. Considera automatizar un aporte.'});
    if(ep>DB.settings.rules.estilo+3) out.push({t:'warn',ic:'🎯',m:'Los gastos de estilo de vida ('+pct(ep)+') superan el '+DB.settings.rules.estilo+'% recomendado. Reducirlos temporalmente podría acelerar el pago de créditos.'});
  }
  const l=liquidity();
  if(l.cls==='ok'&&extraPaymentCapacity()>0) out.push({t:'ok',ic:'✅',m:'Tu liquidez actual permite realizar un abono adicional de hasta '+fmt(extraPaymentCapacity())+' sin reducir tu reserva mínima.'});
  if(l.cls==='danger') out.push({t:'danger',ic:'🚨',m:'Tu liquidez es reducida; mantén únicamente los pagos programados. El saldo disponible no cubre cómodamente los compromisos próximos.'});
  const overdue=DB.credits.filter(c=>c.status==='Atrasado'||c.nextPay<todayISO());
  overdue.forEach(c=>out.push({t:'danger',ic:'🔴',m:'El crédito "'+c.name+'" tiene una cuota vencida o próxima a vencer. Priorízalo para evitar cargos adicionales.'}));
  const todayClose=DB.closures.find(cl=>cl.date===todayISO());
  if(!todayClose) out.push({t:'warn',ic:'📅',m:'No se ha registrado el cierre de hoy. Realiza el cierre diario para mantener tus indicadores actualizados.'});
  const emg=DB.goals.find(g=>g.type==='Fondo de emergencia');
  if(emg&&emg.saved<emg.target*0.5) out.push({t:'warn',ic:'🛡️',m:'Antes de aumentar el pago de créditos, sería conveniente fortalecer tu fondo de emergencia (va en '+pct(emg.saved/emg.target*100)+').'});
  if(out.length===0) out.push({t:'ok',ic:'✅',m:'Tus indicadores se encuentran dentro de los rangos recomendados. Mantén el hábito de registrar movimientos y cierres diarios.'});
  return out;
}
function planStatus(realV,recV){
  if(recV<=0) return {label:'Sin información suficiente',cls:'mut'};
  const ratio=realV/recV;
  if(ratio>1.08) return {label:'Por encima del límite',cls:'danger'};
  if(ratio>0.98) return {label:'Cerca del límite',cls:'warn'};
  if(ratio<0.6) return {label:'Por debajo de la meta',cls:'mut'};
  return {label:'Dentro del objetivo',cls:'ok'};
}

function doClosure(ins,outs,pays,calc){
  const t=todayISO();
  // process credit payment first
  if(_payYes){
    const amt=+document.getElementById('p_amount').value||0;
    if(amt>0){
      const cid=document.getElementById('p_credit').value;
      const res=applyCreditPayment(cid,{amount:amt,account:document.getElementById('p_acc').value,type:document.getElementById('p_type').value,capital:+document.getElementById('p_cap').value||0,interest:+document.getElementById('p_int').value||0,fee:+document.getElementById('p_fee').value||0,num:document.getElementById('p_num').value,note:document.getElementById('p_note').value,date:t});
      pays+=amt;calc-=amt;
      toast('Pago registrado',res.msg,'info');
    }
  }
  const real=+document.getElementById('c_real').value||calc;
  const cl={id:uid(),date:t,ins,outs,pays,calc,real,diff:real-calc,obs:document.getElementById('c_obs').value};
  DB.closures=DB.closures.filter(c=>c.date!==t);DB.closures.push(cl);

  const summary='Durante el día ingresaron '+fmt(ins)+' y se registraron salidas por '+fmt(outs)+(pays?', incluyendo '+fmt(pays)+' en pago de créditos':'')+'. El saldo disponible al finalizar el día es de '+fmt(real)+'.';
  toast('Cierre realizado',summary,'info');render();
}

/* ---- credit payment logic (shared) ---- */
function applyCreditPayment(creditId,pay){
  const c=DB.credits.find(x=>x.id===creditId);if(!c)return {msg:'Crédito no encontrado'};
  let interest=pay.interest, capital=pay.capital;
  if(!interest&&!capital){interest=Math.round(c.balance*(c.rate/100));capital=Math.max(0,pay.amount-interest-(pay.fee||0));}
  capital=Math.min(capital,c.balance);
  const before={balance:c.balance,finish:estFinishDate(c),cuotas:creditRemainingCuotas(c)};
  c.balance=Math.max(0,c.balance-capital);
  c.paidCuotas=(c.paidCuotas||0)+1;
  c.nextPay=addDaysISO(c.nextPay,30);
  if(c.balance<=0){c.status='Pagado';c.nextPay='—';}
  else if(c.status==='Atrasado')c.status='Al día';
  const acc=DB.accounts.find(a=>a.name===pay.account);if(acc)acc.balance-=pay.amount;
  DB.payments.unshift({id:uid(),creditId,creditName:c.name,amount:pay.amount,date:pay.date||todayISO(),account:pay.account,type:pay.type,capital,interest,fee:pay.fee||0,note:pay.note,num:pay.num});
  logHistory('Pago crédito','Pago de '+fmt(pay.amount)+' a '+c.name);save();
  return {msg:'Se registró un pago de '+fmt(pay.amount)+' al '+c.name+'. Capital: '+fmt(capital)+', intereses: '+fmt(interest)+'. Saldo actualizado a '+fmt(c.balance)+'.',before,after:{balance:c.balance,finish:estFinishDate(c),cuotas:creditRemainingCuotas(c)}};
}

/* ---- Estrategia de pago ---- */
VIEWS.estrategia=function(){
  const cap=extraPaymentCapacity();const l=liquidity();
  return `<div class="page-head"><h2>Estrategia de pago</h2><p>Propuesta informativa basada únicamente en tus datos registrados. No constituye asesoría profesional.</p></div>
  <div class="alert-inline ${l.cls==='ok'?'ok':l.cls==='warn'?'warn':'danger'}">${l.cls==='ok'?'✅ Puedes destinar hasta '+fmt(cap)+' a abonos adicionales sin afectar tu reserva mínima.':l.cls==='danger'?'🚨 No se recomienda realizar pagos adicionales este mes: tus compromisos superan el saldo disponible.':'⚠️ Liquidez ajustada. Prioriza los pagos programados antes de abonos extra.'}</div>
  <div class="sec-title">Selecciona una estrategia</div>
  <div class="pill-row">
    <span class="pill ${DB.strategy==='avalanche'?'active':''}" onclick="setStrategy('avalanche')">Mayor tasa primero</span>
    <span class="pill ${DB.strategy==='snowball'?'active':''}" onclick="setStrategy('snowball')">Menor saldo primero</span>
    <span class="pill ${DB.strategy==='minimum'?'active':''}" onclick="setStrategy('minimum')">Solo pagos mínimos</span>
    <span class="pill ${DB.strategy==='overdue'?'active':''}" onclick="setStrategy('overdue')">Priorizar atrasados</span>
    <span class="pill ${DB.strategy==='liquidity'?'active':''}" onclick="setStrategy('liquidity')">Sin afectar liquidez</span>
  </div>
  <div class="card"><h3>Orden de pago propuesto</h3><div class="table-wrap"><table id="stratTable"></table></div></div>
  <div class="card" style="margin-top:16px"><h3>Cómo debería pagarse la deuda</h3><div id="payPlan"></div></div>`;
};
AFTER.estrategia=function(){renderStrategy();};
function setStrategy(s){DB.strategy=s;save();renderStrategy();document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));render();}
function orderedCredits(){
  let cs=DB.credits.filter(c=>c.balance>0).slice();
  switch(DB.strategy){
    case 'avalanche':cs.sort((a,b)=>b.rate-a.rate);break;
    case 'snowball':cs.sort((a,b)=>a.balance-b.balance);break;
    case 'overdue':cs.sort((a,b)=>(a.status==='Atrasado'?-1:0)-(b.status==='Atrasado'?-1:0)||a.nextPay.localeCompare(b.nextPay));break;
    case 'minimum':break;
    case 'liquidity':cs.sort((a,b)=>b.rate-a.rate);break;
  }
  return cs;
}
function renderStrategy(){
  const cs=orderedCredits();const t=document.getElementById('stratTable');
  if(!cs.length){t.parentElement.innerHTML='<div class="empty">🎉 No tienes deuda pendiente.</div>';document.getElementById('payPlan').innerHTML='';return;}
  t.innerHTML=`<thead><tr><th>#</th><th>Crédito</th><th>Tasa</th><th>Saldo</th><th>Cuota</th><th>Prioridad</th></tr></thead><tbody>
  ${cs.map((c,i)=>`<tr><td><b>${i+1}</b></td><td>${c.name}${c.status==='Atrasado'?' <span class="badge danger">atrasado</span>':''}</td><td>${c.rate}% ${c.rateType==='Mensual'?'m.v.':'e.a.'}</td><td>${fmtShort(c.balance)}</td><td>${fmtShort(c.cuota)}</td><td><span class="badge ${c.priority==='Alta'?'danger':c.priority==='Media'?'warn':'mut'}">${c.priority}</span></td></tr>`).join('')}
  </tbody>`;
  const cap=DB.strategy==='minimum'?0:extraPaymentCapacity();
  const target=cs[0];
  const min=target.cuota;const rec=DB.strategy==='minimum'?min:min+cap;const extra=rec-min;
  const r=target.rate/100;let bal=target.balance,cuotasBase=0,intBase=0;{let b2=bal;for(let i=0;i<600&&b2>0;i++){const it=b2*r;intBase+=it;b2-=(min-it);cuotasBase++;}}
  let cuotasNew=0,intNew=0;{let b2=bal;for(let i=0;i<600&&b2>0;i++){const it=b2*r;intNew+=it;b2-=(rec-it);cuotasNew++;}}
  const l=liquidity();
  document.getElementById('payPlan').innerHTML=`
  <div class="alert-inline ok">Enfocando en <b style="margin:0 4px">${target.name}</b> según la estrategia seleccionada.</div>
  <div class="subgrid">
    <div class="mini-stat"><span>Cuota programada</span><b>${fmt(target.cuota)}</b></div>
    <div class="mini-stat"><span>Pago mínimo</span><b>${fmt(min)}</b></div>
    <div class="mini-stat"><span>Pago recomendado</span><b style="color:var(--artifact-primary)">${fmt(rec)}</b></div>
    <div class="mini-stat"><span>Abono adicional sugerido</span><b>${fmt(extra)}</b></div>
    <div class="mini-stat"><span>Cuotas (mínimo)</span><b>${cuotasBase}</b></div>
    <div class="mini-stat"><span>Cuotas (recomendado)</span><b>${cuotasNew}</b></div>
    <div class="mini-stat"><span>Ahorro estimado en intereses</span><b style="color:var(--artifact-ok)">${fmt(Math.max(0,intBase-intNew))}</b></div>
    <div class="mini-stat"><span>Impacto en liquidez</span><b>${fmt(l.net-extra)} restante</b></div>
  </div>
  <p style="font-size:12px;color:var(--artifact-text-muted);margin-top:12px">Estas cifras son estimaciones informativas basadas en la información registrada y pueden variar según las condiciones reales de cada crédito.</p>`;
}

/* ---- Liquidez ---- */
VIEWS.liquidez=function(){
  const l=liquidity();const cap=extraPaymentCapacity();
  const upc=upcomingObligations(15);
  let advice;
  if(cap>0&&l.cls==='ok')advice='Puedes realizar un pago adicional de '+fmt(cap)+' sin reducir tu reserva mínima de liquidez.';
  else if(l.cls==='danger')advice='No se recomienda realizar un pago adicional este mes porque tus compromisos próximos son superiores o cercanos al saldo disponible.';
  else advice='Antes de aumentar el pago del crédito, sería conveniente fortalecer el fondo de emergencia y mantener los pagos programados.';
  return `<div class="page-head"><h2>Nivel de liquidez</h2><p>Disponibilidad real tras descontar gastos, compromisos y reservas.</p></div>
  <div class="grid kpis" style="margin-bottom:16px">
    <div class="card kpi"><div class="label">Saldo disponible</div><div class="value">${fmt(l.disp)}</div></div>
    <div class="card kpi"><div class="label">Compromisos próximos (15d)</div><div class="value">${fmt(l.upcoming)}</div></div>
    <div class="card kpi"><div class="label">Liquidez neta</div><div class="value">${fmt(l.net)}</div></div>
    <div class="card kpi"><div class="label">Estado</div><div class="value" style="font-size:18px"><span class="badge ${l.cls}">${l.state}</span></div></div>
  </div>
  <div class="two-col">
    <div class="card"><h3>Medidor de liquidez</h3><div id="liqGauge" class="chart"></div></div>
    <div class="card"><h3>Recomendación</h3><div class="rec ${l.cls==='ok'?'ok':l.cls==='danger'?'danger':'warn'}"><span class="rc-ic">💧</span><span>${advice}</span></div>
    <div class="sec-title">Próximas obligaciones</div>
    ${upc.length?upc.map(o=>`<div class="mini-stat"><span>${o.name} ${o.overdue?'<span class="badge danger">vencida</span>':''}</span><b>${fmtShort(o.amount)} · ${o.date}</b></div>`).join(''):'<div class="empty" style="padding:20px">Sin obligaciones próximas.</div>'}
    </div>
  </div>`;
};
AFTER.liquidez=function(){
  const l=liquidity();const axis=themeAxis();
  const ratio=Math.max(0,Math.min(1,l.net/(l.min*4)));
  mkChart('liqGauge',{series:[{type:'gauge',startAngle:210,endAngle:-30,min:0,max:100,progress:{show:true,width:16},axisLine:{lineStyle:{width:16,color:[[0.25,'#e5484d'],[0.5,'#e79325'],[1,'#12b28c']]}},pointer:{width:5},axisLabel:{show:false},axisTick:{show:false},splitLine:{show:false},detail:{formatter:()=>l.state,color:axis,fontSize:16,offsetCenter:[0,'40%']},data:[{value:Math.round(ratio*100)}]}]});
};

  ${keys.map(k=>{const rv=rec[k],av=real[k];const st=planStatus(av,rv);const diff=av-rv;const dp=inc?((av-rv)/inc*100):0;

function periodSpent(b){
  const now=todayISO();let from;
  if(b.period==='Mes')from=now.slice(0,7)+'-01';
  else if(b.period==='Semana')from=addDaysISO(now,-7);
  else if(b.period==='Quincena')from=addDaysISO(now,-15);
  else from=now.slice(0,4)+'-01-01';
  return DB.expenses.filter(e=>e.category===b.category&&e.date>=from).reduce((s,e)=>s+e.amount,0);
}
function periodDaysLeft(b){const now=new Date();if(b.period==='Mes'){const end=new Date(now.getFullYear(),now.getMonth()+1,0);return Math.max(0,daysBetween(todayISO(),end.toISOString().slice(0,10)));}if(b.period==='Semana')return 7;if(b.period==='Quincena')return 15;return 30;}
function renderBudgets(){
  const w=document.getElementById('budList');
  if(!DB.budgets.length){w.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="big">📁</div>Sin presupuestos. Crea el primero.</div>';return;}
  w.innerHTML=DB.budgets.map(b=>{const spent=periodSpent(b);const p=b.amount?Math.min(100,spent/b.amount*100):0;const left=b.amount-spent;const dl=periodDaysLeft(b);const daily=left>0&&dl>0?left/dl:0;
    const cls=p>100?'danger':p>85?'warn':'ok';
    return `<div class="card"><div style="display:flex;justify-content:space-between"><div><b>${b.category}</b><div style="font-size:11.5px;color:var(--artifact-text-muted)">${b.period}</div></div><span class="badge ${cls}">${pct(p)}</span></div>
    <div style="font-size:20px;font-weight:800;margin:8px 0 4px">${fmt(spent)} <span style="font-size:12px;color:var(--artifact-text-muted);font-weight:500">/ ${fmtShort(b.amount)}</span></div>
    <div class="progress"><div style="width:${p}%;background:${p>100?'var(--artifact-danger)':'var(--artifact-primary)'}"></div></div>
    <div class="mini-stat" style="margin-top:10px"><span>Saldo restante</span><b style="color:${left<0?'var(--artifact-danger)':'inherit'}">${fmtShort(left)}</b></div>
    <div class="mini-stat"><span>Días restantes</span><b>${dl}</b></div>
    <div class="mini-stat"><span>Promedio diario disponible</span><b>${fmtShort(daily)}</b></div>
    <div class="row-actions" style="margin-top:10px"><button class="btn sm" onclick="openBudgetModal('${b.id}')">✏️</button><button class="btn sm danger" onclick="delItem('budgets','${b.id}')">🗑</button></div></div>`;}).join('');
}
function openBudgetModal(id){
  const b=id?DB.budgets.find(x=>x.id===id):null;

render();
window.addEventListener('firebase-ready',initFirebase);
if(window.__fb||window.__fbError)initFirebase();

/* ------------------------------ PDF export bridge ------------------------------ */
if(window.GleanBridge){
  window.GleanBridge.postMessage({actionId:'export-pdf',type:'glean-add-menu',metadata:{label:'Export as PDF',icon:'export'}});
  window.GleanBridge.onMessage('action',function(data){if(data.actionId==='export-pdf')window.print();});
}
function prepareChartsForPrint(){document.querySelectorAll('[_echarts_instance_]').forEach(function(el){var chart=echarts.getInstanceByDom(el);if(!chart)return;var img=new Image();img.src=chart.getDataURL({type:'png',pixelRatio:2});img.className='print-chart-img';img.style.cssText='width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;z-index:10;';el.dataset.prevPosition=el.style.position;el.style.position='relative';el.appendChild(img);});}
function cleanUpAfterPrint(){document.querySelectorAll('[_echarts_instance_]').forEach(function(el){var img=el.querySelector('.print-chart-img');if(!img)return;img.remove();el.style.position=el.dataset.prevPosition||'';delete el.dataset.prevPosition;});}
window.addEventListener('beforeprint',prepareChartsForPrint);
window.addEventListener('afterprint',cleanUpAfterPrint);
</script>
</body>
</html>
